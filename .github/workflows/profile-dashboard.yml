name: Profile Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
      - feat/external-services-map
    paths:
      - "tools/update-profile-dashboard.py"
      - "tools/generate-profile-visuals.py"
      - "tools/generate-profile-analytics-v2.py"
      - "tools/generate-profile-live-panels.py"
      - "tools/style-profile-layout.py"
      - "tools/add-data-platform-section.py"
      - "tools/apply-glow-borders.py"
      - "tools/cleanup-profile-readme.py"
      - ".github/workflows/profile-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: profile-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Normalize headings for generator
        shell: bash
        run: |
          sed -i 's/Public Commit Activity in the Last Year/Contributions in the Last Year/g' README.md
          sed -i 's/<h3 align="center">Live Public Activity<\/h3>/<h3 align="center">Recent Public Activity<\/h3>/g' README.md

      - name: Generate live profile dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/update-profile-dashboard.py

      - name: Generate detailed Leviathan visuals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/generate-profile-visuals.py

      - name: Polish generated visual layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/profile/roadmap.svg')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '<text x="760" y="141" fill="#b7d0dc" font-family="Segoe UI,Arial,sans-serif" font-size="12">Legacy Fabric 1.8.9 • Modrinth pagination • Installer/uninstall • Physical Android TV Cast</text>',
              '<text x="760" y="138" fill="#b7d0dc" font-family="Segoe UI,Arial,sans-serif" font-size="10.5">Legacy Fabric 1.8.9 • Modrinth pagination • Installer/uninstall</text><text x="760" y="150" fill="#8faebe" font-family="Segoe UI,Arial,sans-serif" font-size="10.5">Physical Android TV Cast validation</text>'
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Generate unified analytics dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/generate-profile-analytics-v2.py

      - name: Generate live activity panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/generate-profile-live-panels.py

      - name: Apply cohesive profile layout
        run: python tools/style-profile-layout.py

      - name: Add data platform section
        run: python tools/add-data-platform-section.py

      - name: Remove private and redundant profile copy
        run: python tools/cleanup-profile-readme.py

      - name: Clarify public language analytics
        shell: bash
        run: |
          sed -i 's/Public Code Language Mix/Public Repository Language Mix/g' assets/profile/languages.svg
          sed -i 's/Aggregated from public repositories only/Languages detected in public repositories only/g' assets/profile/languages.svg

      - name: Apply animated Leviathan borders
        run: python tools/apply-glow-borders.py

      - name: Validate generated dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          if not readme.is_file():
              raise SystemExit("README.md is missing")

          text = readme.read_text(encoding="utf-8")
          required_text = [
              "<!-- RECENT_ACTIVITY_START -->",
              "<!-- RECENT_ACTIVITY_END -->",
              "<!-- REPOSITORY_FRESHNESS_START -->",
              "<!-- REPOSITORY_FRESHNESS_END -->",
              "<!-- PUBLIC_ANALYTICS_START -->",
              "<!-- PUBLIC_ANALYTICS_END -->",
              "Public Commit Activity in the Last Year",
              "Public Development Analytics",
              "Live Public Activity",
              "Public Repository Health",
              "Leviathan Neural Core",
              "Identity & External Services",
              "Leviathan Ecosystem",
              "Data Platform",
              "Development Roadmap",
              "assets/profile/external-services.svg",
              "assets/profile/analytics-overview.svg",
              "assets/profile/activity-feed.svg",
              "assets/profile/repository-health.svg",
              "assets/profile/data-platform.svg",
              "assets/profile/ecosystem-overview.svg",
          ]

          missing_text = [item for item in required_text if item not in text]

          forbidden_text = [
              "Browse public research lists",
              "Research-Library",
              "The Pacman graph is generated by GitHub Actions and stored in this profile repository.",
              "Generated from public GitHub repositories and public activity only. Private repositories and proprietary source code are excluded.",
          ]
          leaked_text = [item for item in forbidden_text if item in text]

          required_assets = [
              Path("assets/hero-dark.svg"),
              Path("assets/hero-light.svg"),
              Path("assets/profile/contributions.svg"),
              Path("assets/profile/neural-core.svg"),
              Path("assets/profile/external-services.svg"),
              Path("assets/profile/data-platform.svg"),
              Path("assets/profile/ecosystem-overview.svg"),
              Path("assets/profile/roadmap.svg"),
              Path("assets/profile/command-core.svg"),
              Path("assets/profile/pacman.svg"),
              Path("assets/profile/analytics-overview.svg"),
              Path("assets/profile/activity-feed.svg"),
              Path("assets/profile/repository-health.svg"),
          ]

          missing_assets = [str(path) for path in required_assets if not path.is_file() or path.stat().st_size == 0]

          if missing_text:
              print("Missing README markers/sections:")
              for item in missing_text:
                  print(f"  - {item}")

          if leaked_text:
              print("Private or redundant README copy returned:")
              for item in leaked_text:
                  print(f"  - {item}")

          if missing_assets:
              print("Missing or empty profile assets:")
              for item in missing_assets:
                  print(f"  - {item}")

          if missing_text or leaked_text or missing_assets:
              raise SystemExit(1)

          visual_checks = {
              "assets/profile/contributions.svg": ["TOTAL COMMITS", "MONTHLY OUTPUT", "365 DAY SIGNAL"],
              "assets/profile/roadmap.svg": ["OUTSTANDING MANUAL GATES", "PHASE 07", "PUBLIC RELEASE GATE REMAINS CLOSED", "Physical Android TV Cast validation"],
              "assets/profile/neural-core.svg": ["PUBLIC ARCHITECTURE MAP", "INTEGRATIONS", "PUBLIC SANITIZED MODEL"],
              "assets/profile/external-services.svg": ["IDENTITY &amp; EXTERNAL SERVICE BOUNDARIES", "MICROSOFT", "MINECRAFT"],
              "assets/profile/data-platform.svg": ["LEVIATHAN DATA PLATFORM", "POSTGRESQL", "EVENT PIPELINE"],
              "assets/profile/ecosystem-overview.svg": ["LEVIATHAN ECOSYSTEM", "PLAYER SOFTWARE", "OBSERVABILITY"],
              "assets/profile/analytics-overview.svg": ["PUBLIC DEVELOPMENT TELEMETRY", "14-Day Public Activity Signal", "PUBLIC REPOS"],
              "assets/profile/activity-feed.svg": ["LIVE PUBLIC ACTIVITY FEED"],
              "assets/profile/repository-health.svg": ["PUBLIC REPOSITORY HEALTH"],
          }
          for filename, markers in visual_checks.items():
              content = Path(filename).read_text(encoding="utf-8")
              for marker in markers:
                  if marker not in content:
                      raise SystemExit(f"Detailed visual validation failed: {filename} missing {marker}")

          for path in required_assets:
              content = path.read_text(encoding="utf-8")
              if "LEVIATHAN_GLOW_BORDER_V1" not in content:
                  raise SystemExit(f"Animated border validation failed: {path}")

          print("Profile dashboard validation passed.")
          for path in required_assets:
              print(f"  {path}: {path.stat().st_size} bytes")
          PY

      - name: Commit dashboard refresh
        shell: bash
        run: |
          if git diff --quiet -- README.md assets/hero-dark.svg assets/hero-light.svg assets/profile; then
            echo "Profile dashboard already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/hero-dark.svg assets/hero-light.svg assets/profile
          git commit -m "chore: refresh profile visuals"

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
            fi
            git rebase --abort || true
            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 3))
          done

          echo "Profile dashboard refresh could not be pushed after retries."
          exit 1
