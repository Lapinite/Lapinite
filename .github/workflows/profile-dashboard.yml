name: Profile Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "tools/update-profile-dashboard.py"
      - "tools/generate-profile-visuals.py"
      - "tools/generate-profile-analytics-v2.py"
      - "tools/generate-profile-live-panels.py"
      - "tools/generate-profile-hud-v2.py"
      - "tools/style-profile-layout.py"
      - "tools/add-data-platform-section.py"
      - "tools/apply-profile-holographic-layout.py"
      - "tools/apply-glow-borders.py"
      - "tools/cleanup-profile-readme.py"
      - "tools/enhance-profile-readme.py"
      - "assets/hero-dark-v4.svg"
      - "assets/hero-light-v4.svg"
      - "assets/profile/**"
      - ".github/workflows/profile-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: profile-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Normalize headings for generator
        shell: bash
        run: |
          sed -i 's/Public Commit Activity in the Last Year/Contributions in the Last Year/g' README.md
          sed -i 's/<h3 align="center">Live Public Activity<\/h3>/<h3 align="center">Recent Public Activity<\/h3>/g' README.md

      - name: Generate base public dashboard data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/update-profile-dashboard.py

      - name: Generate detailed public-safe visuals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/generate-profile-visuals.py

      - name: Generate legacy analytics inputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/generate-profile-analytics-v2.py

      - name: Generate legacy live panel inputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/generate-profile-live-panels.py

      - name: Apply base visual layout
        run: python tools/style-profile-layout.py

      - name: Ensure data platform section
        run: python tools/add-data-platform-section.py

      - name: Remove private and redundant profile copy
        run: python tools/cleanup-profile-readme.py

      - name: Apply visual-first sections
        run: python tools/enhance-profile-readme.py

      - name: Generate final holographic live HUD panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/generate-profile-hud-v2.py

      - name: Enforce final holographic asset references
        run: python tools/apply-profile-holographic-layout.py

      - name: Validate holographic profile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          required_refs = [
              "assets/hero-dark-v4.svg",
              "assets/hero-light-v4.svg",
              "assets/profile/command-core-v3.svg",
              "assets/profile/neural-core-v3.svg",
              "assets/profile/external-services-v2.svg",
              "assets/profile/data-platform-v2.svg",
              "assets/profile/roadmap-v2.svg",
              "assets/profile/core-products-v2.svg",
              "assets/profile/tech-stack-v2.svg",
              "assets/profile/ecosystem-overview-v2.svg",
              "assets/profile/platform-areas-v2.svg",
              "assets/profile/experience-commerce-v2.svg",
              "assets/profile/developer-network-v2.svg",
              "assets/profile/account-overview-v2.svg",
              "assets/profile/contributions-v2.svg",
              "assets/profile/activity-feed-v2.svg",
              "assets/profile/repository-health-v2.svg",
              "assets/profile/analytics-overview-v2.svg",
              "assets/profile/launcher-status-v2.svg",
              "assets/profile/pacman-v2.svg",
          ]

          missing_refs = [item for item in required_refs if item not in text]
          missing_assets = [item for item in required_refs if not Path(item).is_file() or Path(item).stat().st_size == 0]

          forbidden_refs = [
              "assets/profile/command-core.svg",
              "assets/profile/neural-core.svg",
              "assets/profile/external-services.svg",
              "assets/profile/data-platform.svg",
              "assets/profile/roadmap.svg",
              "assets/profile/core-products.svg",
              "assets/profile/tech-stack.svg",
              "assets/profile/ecosystem-overview.svg",
              "assets/profile/platform-areas.svg",
              "assets/profile/experience-commerce.svg",
              "assets/profile/developer-network.svg",
              "assets/profile/contributions.svg",
              "assets/profile/activity-feed.svg",
              "assets/profile/repository-health.svg",
              "assets/profile/analytics-overview.svg",
              "assets/profile/pacman.svg",
          ]
          stale_refs = [item for item in forbidden_refs if item in text]

          required_text = [
              "v51.0.6",
              "no public launcher or installer release",
              "public release gate remains closed",
          ]
          missing_text = [item for item in required_text if item not in text.lower()]

          if missing_refs or missing_assets or stale_refs or missing_text:
              print("missing_refs", missing_refs)
              print("missing_assets", missing_assets)
              print("stale_refs", stale_refs)
              print("missing_text", missing_text)
              raise SystemExit(1)

          print("Holographic profile validation passed.")
          PY

      - name: Commit dashboard refresh
        shell: bash
        run: |
          if git diff --quiet -- README.md assets/profile; then
            echo "Profile dashboard already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/profile
          git commit -m "chore: refresh holographic profile HUD"

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
            fi
            git rebase --abort || true
            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 3))
          done

          echo "Profile dashboard refresh could not be pushed after retries."
          exit 1
