  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0875d8"/><stop offset=".5" stop-color="#10b8d7"/><stop offset="1" stop-color="#006ddc"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#20b8dc" stop-opacity=".38"/><stop offset=".35" stop-color="#28bfe0" stop-opacity=".14"/><stop offset="1" stop-color="#3b83e8" stop-opacity="0"/></radialGradient>
  <linearGradient id="serpent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05a9c5"/><stop offset="1" stop-color="#176ed6"/></linearGradient>
