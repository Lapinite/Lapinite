<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020913"/><stop offset="1" stop-color="#061725"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#12364b" stroke-width="1" opacity=".18"/></pattern></defs><rect width="1200" height="560" rx="24" fill="url(#bg)"/><rect width="1200" height="560" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="558" rx="23" fill="none" stroke="#173b51"/><text x="42" y="45" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3">IDENTITY &amp; EXTERNAL SERVICE BOUNDARIES</text><text x="42" y="70" fill="#7d9fb2" font-family="Segoe UI,Arial" font-size="12">Microsoft, Xbox and Minecraft services remain external trust boundaries; Leviathan stores only the platform state it needs.</text><path id="auth" d="M90 185 H1060" fill="none" stroke="#174c66" stroke-width="4" stroke-linecap="round"/><circle r="6" fill="#63f2ff" filter="url(#g)"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#auth"/></animateMotion></circle><g font-family="Segoe UI,Arial" text-anchor="middle"><g><circle cx="120" cy="185" r="42" fill="#071a26" stroke="#2adbf2" stroke-width="2"/><text x="120" y="180" fill="#eefcff" font-size="13" font-weight="700">MICROSOFT</text><text x="120" y="198" fill="#7f9fb0" font-size="10">OAuth</text></g><g><circle cx="300" cy="185" r="42" fill="#071a26" stroke="#2adbf2" stroke-width="2"/><text x="300" y="180" fill="#eefcff" font-size="13" font-weight="700">XBOX LIVE</text><text x="300" y="198" fill="#7f9fb0" font-size="10">identity</text></g><g><circle cx="480" cy="185" r="42" fill="#071a26" stroke="#2adbf2" stroke-width="2"/><text x="480" y="180" fill="#eefcff" font-size="13" font-weight="700">XSTS</text><text x="480" y="198" fill="#7f9fb0" font-size="10">authorization</text></g><g><circle cx="660" cy="185" r="42" fill="#071a26" stroke="#8174ff" stroke-width="2"/><text x="660" y="176" fill="#eefcff" font-size="12" font-weight="700">MINECRAFT</text><text x="660" y="194" fill="#eefcff" font-size="12" font-weight="700">SERVICES</text></g><g><circle cx="840" cy="185" r="42" fill="#071a26" stroke="#43d9a3" stroke-width="2"/><text x="840" y="176" fill="#eefcff" font-size="11" font-weight="700">OWNERSHIP</text><text x="840" y="194" fill="#eefcff" font-size="11" font-weight="700">+ PROFILE</text></g><g><circle cx="1020" cy="185" r="48" fill="#061a28" stroke="#36e4f7" stroke-width="2.5" filter="url(#g)"/><text x="1020" y="178" fill="#eefcff" font-size="13" font-weight="800">LEVIATHAN</text><text x="1020" y="198" fill="#62dce9" font-size="10">identity boundary</text></g></g><path id="data" d="M1020 240 C1020 315 900 350 760 350 H330" fill="none" stroke="#1d708d" stroke-width="2" stroke-dasharray="6 8"/><circle r="5" fill="#50eaff" filter="url(#g)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#data"/></animateMotion></circle><g font-family="Segoe UI,Arial" text-anchor="middle"><g><rect x="125" y="330" width="240" height="100" rx="14" fill="#061722" stroke="#8174ff"/><text x="245" y="362" fill="#eefcff" font-size="16" font-weight="750">LEVIATHAN AUTH</text><text x="245" y="386" fill="#8ba7b7" font-size="10">account mapping • session state</text><text x="245" y="405" fill="#688a9d" font-size="10">permissions • linked Minecraft identity</text></g><g><rect x="480" y="330" width="240" height="100" rx="14" fill="#061722" stroke="#2acbe5"/><text x="600" y="362" fill="#eefcff" font-size="16" font-weight="750">PLATFORM DATA</text><text x="600" y="386" fill="#8ba7b7" font-size="10">profiles • devices • Cast • entitlements</text><text x="600" y="405" fill="#688a9d" font-size="10">launcher/client state • integration state</text></g><g><rect x="835" y="330" width="240" height="100" rx="14" fill="#061722" stroke="#43d9a3"/><text x="955" y="362" fill="#eefcff" font-size="16" font-weight="750">OBSERVABILITY</text><text x="955" y="386" fill="#8ba7b7" font-size="10">telemetry • analytics • audit events</text><text x="955" y="405" fill="#688a9d" font-size="10">without storing raw account secrets</text></g></g><text x="600" y="490" text-anchor="middle" fill="#65889b" font-family="ui-monospace,Consolas,monospace" font-size="10">EXTERNAL SERVICES OWN THEIR CREDENTIALS • LEVIATHAN OWNS ITS ACCOUNT MAPPING, PRODUCT STATE AND PLATFORM DATA</text><rect x="4" y="4" width="1192" height="552" rx="22" fill="none" stroke="#0b3346" stroke-width="1.5"/><rect x="4" y="4" width="1192" height="552" rx="22" fill="none" stroke="#32efff" stroke-width="3" stroke-dasharray="420 1700" filter="url(#g)" opacity=".9"><animate attributeName="stroke-dashoffset" values="0;-2120" dur="10s" repeatCount="indefinite"/></rect>
<!-- LEVIATHAN_GLOW_BORDER_V1 -->
<defs>
  <linearGradient id="leviathanBorderGradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#067dff"/>
    <stop offset="0.34" stop-color="#32efff"/>
    <stop offset="0.62" stop-color="#11bddf"/>
    <stop offset="1" stop-color="#4a65ff"/>
  </linearGradient>
  <filter id="leviathanBorderGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="4" y="4" width="1192" height="552" rx="22" fill="none" stroke="#0b3346" stroke-width="1.5" opacity="0.9"/>
<rect x="4" y="4" width="1192" height="552" rx="22" fill="none" stroke="url(#leviathanBorderGradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="457 1672" filter="url(#leviathanBorderGlow)" opacity="0.92">
  <animate attributeName="stroke-dashoffset" values="0;-2129" dur="10s" repeatCount="indefinite"/>
</rect>
<rect x="12" y="12" width="1176" height="536" rx="14" fill="none" stroke="#27dff5" stroke-width="0.7" stroke-dasharray="2 12" opacity="0.2">
  <animate attributeName="stroke-dashoffset" values="0;28" dur="5s" repeatCount="indefinite"/>
</rect>
</svg>