try • Analytics • Logging • Monitoring • Status</text><text x="910" y="418" fill="#688a9d" font-size="10">Health, performance, diagnostics, trends and incident visibility</text></g></g><text x="600" y="488" text-anchor="middle" fill="#5e8093" font-family="ui-monospace,Consolas,monospace" font-size="10">HIGH-LEVEL PUBLIC PRODUCT MODEL • PRIVATE IMPLEMENTATION DETAILS EXCLUDED</text></svg>