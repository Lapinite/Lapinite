<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020913"/><stop offset="1" stop-color="#061725"/></linearGradient><linearGradient id="cyan"><stop stop-color="#087dff"/><stop offset=".5" stop-color="#2deaff"/><stop offset="1" stop-color="#00a8ff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#12364b" opacity=".17"/></pattern></defs><rect width="1200" height="560" rx="24" fill="url(#bg)"/><rect width="1200" height="560" rx="24" fill="url(#grid)"/><text x="42" y="45" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3">IDENTITY &amp; EXTERNAL SERVICE BOUNDARIES</text><text x="42" y="70" fill="#7d9fb2" font-family="Segoe UI,Arial" font-size="12">External identity providers remain separate trust boundaries while Leviathan receives only the platform state it needs.</text><path id="auth" d="M82 185 H1118" fill="none" stroke="#174c66" stroke-width="4"/><rect width="9" height="9" rx="2" fill="#63f2ff" filter="url(#g)"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#auth"/></animateMotion></rect><g font-family="Segoe UI,Arial" text-anchor="middle"><g transform="translate(70 128)"><path d="M0 0 H130 L148 18 V96 L130 114 H0 Z" fill="#071a26" stroke="#2adbf2" stroke-width="2"/><text x="74" y="49" fill="#eefcff" font-size="13" font-weight="700">MICROSOFT</text><text x="74" y="69" fill="#7f9fb0" font-size="10">OAuth</text></g><g transform="translate(250 128)"><path d="M0 0 H130 L148 18 V96 L130 114 H0 Z" fill="#071a26" stroke="#2adbf2" stroke-width="2"/><text x="74" y="49" fill="#eefcff" font-size="13" font-weight="700">XBOX LIVE</text><text x="74" y="69" fill="#7f9fb0" font-size="10">identity</text></g><g transform="translate(430 128)"><path d="M0 0 H130 L148 18 V96 L130 114 H0 Z" fill="#071a26" stroke="#2adbf2" stroke-width="2"/><text x="74" y="49" fill="#eefcff" font-size="13" font-weight="700">XSTS</text><text x="74" y="69" fill="#7f9fb0" font-size="10">authorization</text></g><g transform="translate(610 128)"><path d="M0 0 H130 L148 18 V96 L130 114 H0 Z" fill="#071a26" stroke="#8174ff" stroke-width="2"/><text x="74" y="44" fill="#eefcff" font-size="12" font-weight="700">MINECRAFT</text><text x="74" y="64" fill="#eefcff" font-size="12" font-weight="700">SERVICES</text></g><g transform="translate(790 128)"><path d="M0 0 H130 L148 18 V96 L130 114 H0 Z" fill="#071a26" stroke="#43d9a3" stroke-width="2"/><text x="74" y="44" fill="#eefcff" font-size="11" font-weight="700">OWNERSHIP</text><text x="74" y="64" fill="#eefcff" font-size="11" font-weight="700">+ PROFILE</text></g><g transform="translate(970 120)"><path d="M0 0 H150 L170 20 V112 L150 132 H0 Z" fill="#061a28" stroke="#36e4f7" stroke-width="2.5"/><text x="85" y="57" fill="#eefcff" font-size="14" font-weight="800">LEVIATHAN</text><text x="85" y="78" fill="#62dce9" font-size="10">identity boundary</text></g></g><path id="data" d="M1055 252 V292 H960 L920 326 H280" fill="none" stroke="#1d708d" stroke-width="2" stroke-dasharray="10 8"/><rect width="8" height="8" rx="2" fill="#50eaff" filter="url(#g)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#data"/></animateMotion></rect><g font-family="Segoe UI,Arial" text-anchor="middle"><g><rect x="125" y="330" width="240" height="104" rx="12" fill="#061722" stroke="#8174ff"/><text x="245" y="362" fill="#eefcff" font-size="16" font-weight="750">LEVIATHAN AUTH</text><text x="245" y="387" fill="#8ba7b7" font-size="10">account mapping • session state</text><text x="245" y="406" fill="#688a9d" font-size="10">permissions • linked identity</text></g><g><rect x="480" y="330" width="240" height="104" rx="12" fill="#061722" stroke="#2acbe5"/><text x="600" y="362" fill="#eefcff" font-size="16" font-weight="750">PLATFORM DATA</text><text x="600" y="387" fill="#8ba7b7" font-size="10">profiles • devices • Cast • entitlements</text><text x="600" y="406" fill="#688a9d" font-size="10">launcher/client integration state</text></g><g><rect x="835" y="330" width="240" height="104" rx="12" fill="#061722" stroke="#43d9a3"/><text x="955" y="362" fill="#eefcff" font-size="16" font-weight="750">OBSERVABILITY</text><text x="955" y="387" fill="#8ba7b7" font-size="10">telemetry • analytics • audit events</text><text x="955" y="406" fill="#688a9d" font-size="10">without raw account secrets</text></g></g><path d="M245 434 V468 H955 V434" fill="none" stroke="#1a536b" stroke-width="2"/><rect x="520" y="458" width="160" height="22" rx="5" fill="#061722" stroke="#23617b"/><text x="600" y="473" text-anchor="middle" fill="#6eddea" font-family="ui-monospace,Consolas,monospace" font-size="9">TRUSTED PLATFORM STATE</text><text x="600" y="515" text-anchor="middle" fill="#65889b" font-family="ui-monospace,Consolas,monospace" font-size="10">EXTERNAL SERVICES OWN THEIR CREDENTIALS • LEVIATHAN OWNS ITS ACCOUNT MAPPING, PRODUCT STATE AND PLATFORM DATA</text><rect x="4" y="4" width="1192" height="552" rx="22" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-dasharray="460 1670" filter="url(#g)" opacity=".86"><animate attributeName="stroke-dashoffset" values="0;-2130" dur="10s" repeatCount="indefinite"/></rect></svg>