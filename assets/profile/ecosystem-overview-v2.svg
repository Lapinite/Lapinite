<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020913"/><stop offset="1" stop-color="#061725"/></linearGradient><linearGradient id="c"><stop stop-color="#087dff"/><stop offset=".5" stop-color="#2be8ff"/><stop offset="1" stop-color="#00a8ff"/></linearGradient><filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="520" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="518" rx="23" fill="none" stroke="#173b51"/><text x="42" y="45" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3">LEVIATHAN ECOSYSTEM // PRODUCT SURFACES</text><text x="42" y="70" fill="#7d9fb2" font-family="Segoe UI,Arial,sans-serif" font-size="12">Player software, platform services, protection and observability connected through a shared system bus.</text><g transform="translate(490 195)"><rect width="220" height="150" rx="18" fill="#061a28" stroke="#2ad6ee"/><text x="110" y="48" text-anchor="middle" fill="#effcff" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="800">LEVIATHAN</text><text x="110" y="72" text-anchor="middle" fill="#62dce9" font-family="ui-monospace,Consolas,monospace" font-size="10">CONNECTED PLATFORM</text><path id="bus" d="M30 108 H190" stroke="url(#c)" stroke-width="4"/><rect width="8" height="8" rx="2" fill="#bafcff" filter="url(#g)"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#bus"/></animateMotion></rect><path d="M40 128 H180" stroke="#17485f" stroke-width="2" stroke-dasharray="12 9"><animate attributeName="stroke-dashoffset" values="0;-42" dur="2.2s" repeatCount="indefinite"/></path></g><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><g><rect x="90" y="105" width="330" height="110" rx="16" fill="#061722" stroke="#22bddb"/><text x="255" y="140" fill="#eefcff" font-size="18" font-weight="750">PLAYER SOFTWARE</text><text x="255" y="166" fill="#8aa7b7" font-size="11">Launcher • Client • Profiles • Instances • Updates</text><text x="255" y="190" fill="#688a9d" font-size="10">Minecraft ownership, customization and launch experience</text></g><g><rect x="90" y="338" width="330" height="110" rx="16" fill="#061722" stroke="#ff9f43"/><text x="255" y="373" fill="#eefcff" font-size="18" font-weight="750">PROTECTION</text><text x="255" y="399" fill="#8aa7b7" font-size="11">Nimbus • Security • Integrity • Abuse Protection</text><text x="255" y="423" fill="#688a9d" font-size="10">Validation, reliability and false-positive control</text></g><g><rect x="780" y="105" width="330" height="110" rx="16" fill="#061722" stroke="#8174ff"/><text x="945" y="140" fill="#eefcff" font-size="18" font-weight="750">PLATFORM</text><text x="945" y="166" fill="#8aa7b7" font-size="11">Auth • API • Accounts • Cast • Connected Services</text><text x="945" y="190" fill="#688a9d" font-size="10">Identity, device links and platform coordination</text></g><g><rect x="780" y="338" width="330" height="110" rx="16" fill="#061722" stroke="#43d9a3"/><text x="945" y="373" fill="#eefcff" font-size="18" font-weight="750">OBSERVABILITY</text><text x="945" y="399" fill="#8aa7b7" font-size="11">Telemetry • Analytics • Logging • Monitoring • Status</text><text x="945" y="423" fill="#688a9d" font-size="10">Health, performance, diagnostics and incidents</text></g></g><g fill="none" stroke="#176987" stroke-width="1.7"><path id="a" d="M420 160 H490"/><path id="b" d="M420 393 H490"/><path id="c1" d="M710 160 H780"/><path id="d" d="M710 393 H780"/></g><g><rect width="7" height="7" rx="2" fill="#63f2ff"><animateMotion dur="3.3s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></rect><rect width="7" height="7" rx="2" fill="#ffb45e"><animateMotion dur="3.8s" begin=".6s" repeatCount="indefinite"><mpath href="#b"/></animateMotion></rect><rect width="7" height="7" rx="2" fill="#8174ff"><animateMotion dur="3.5s" begin=".3s" repeatCount="indefinite"><mpath href="#c1"/></animateMotion></rect><rect width="7" height="7" rx="2" fill="#43d9a3"><animateMotion dur="4s" begin=".9s" repeatCount="indefinite"><mpath href="#d"/></animateMotion></rect></g><text x="600" y="488" text-anchor="middle" fill="#5e8093" font-family="ui-monospace,Consolas,monospace" font-size="10">HIGH-LEVEL PUBLIC PRODUCT MODEL • PRIVATE IMPLEMENTATION DETAILS EXCLUDED</text><rect x="4" y="4" width="1192" height="512" rx="22" fill="none" stroke="url(#c)" stroke-width="3" stroke-dasharray="447 1634" filter="url(#g)" opacity=".86"><animate attributeName="stroke-dashoffset" values="0;-2081" dur="10s" repeatCount="indefinite"/></rect></svg>