<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020913"/><stop offset=".55" stop-color="#061927"/><stop offset="1" stop-color="#020b13"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0a82ff"/><stop offset=".5" stop-color="#32edff"/><stop offset="1" stop-color="#00a9ff"/></linearGradient><filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#103148" opacity=".24"/></pattern></defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/><rect width="1200" height="360" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#16394e"/>
<text x="42" y="45" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3">LEVIATHAN COMMAND CORE // LIVE DEVELOPMENT HUD</text><text x="42" y="70" fill="#789aaf" font-family="Segoe UI,Arial,sans-serif" font-size="12">Reactive public status interface for the Leviathan ecosystem.</text><rect x="1107" y="35" width="9" height="9" rx="2" fill="#43e49a"><animate attributeName="opacity" values=".3;1;.3" dur="1.5s" repeatCount="indefinite"/></rect><text x="1128" y="45" fill="#7598aa" font-family="ui-monospace,Consolas,monospace" font-size="10">ONLINE</text><line x1="42" y1="84" x2="1158" y2="84" stroke="#17384c"/>
<g font-family="ui-monospace,Consolas,monospace"><g><rect x="42" y="104" width="220" height="76" rx="13" fill="#061722" stroke="#17465e"/><text x="60" y="128" fill="#63869a" font-size="10">SYSTEM</text><text x="60" y="155" fill="#effbff" font-size="17" font-weight="700">LEVIATHAN PLATFORM</text></g><g><rect x="280" y="104" width="220" height="76" rx="13" fill="#061722" stroke="#17465e"/><text x="298" y="128" fill="#63869a" font-size="10">PHASE</text><text x="298" y="155" fill="#65efff" font-size="17" font-weight="700">STABILIZATION</text></g><g><rect x="518" y="104" width="220" height="76" rx="13" fill="#061722" stroke="#17465e"/><text x="536" y="128" fill="#63869a" font-size="10">BASELINE</text><text x="536" y="155" fill="#effbff" font-size="17" font-weight="700">v51.0.6 INTERNAL</text></g><g><rect x="756" y="104" width="180" height="76" rx="13" fill="#061722" stroke="#17465e"/><text x="774" y="128" fill="#63869a" font-size="10">SOURCE</text><text x="774" y="155" fill="#45dfa0" font-size="17" font-weight="700">PRIVATE</text></g></g>
<!-- living command spine replaces reactor/orbit -->
<g transform="translate(962 95)"><path d="M15 18 H108 L134 44 H195" fill="none" stroke="#1a6a87" stroke-width="2"/><path d="M15 78 H92 L124 49 H199" fill="none" stroke="#33dff6" stroke-width="2"/><path d="M15 138 H112 L145 106 H199" fill="none" stroke="#1a6a87" stroke-width="2"/><path id="spine" d="M22 18 H83 L113 48 H165 L190 78 H130 L98 108 H46" fill="none" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#g)"/><rect width="7" height="7" rx="2" fill="#bafcff"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#spine"/></animateMotion></rect><g fill="#45dfa0"><rect x="10" y="14" width="8" height="8" rx="2"/><rect x="191" y="74" width="8" height="8" rx="2"/><rect x="40" y="104" width="8" height="8" rx="2"/></g><text x="10" y="166" fill="#65889b" font-family="ui-monospace,Consolas,monospace" font-size="8">LIVE SIGNAL ROUTING</text></g>
<text x="42" y="212" fill="#5f8296" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.4">SYSTEM AREAS</text><g font-family="Segoe UI,Arial,sans-serif" font-size="11"><g><rect x="42" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><rect x="55" y="245" width="8" height="8" rx="2" fill="#35d997"/><text x="72" y="253" fill="#c9dce6">Launcher</text></g><g><rect x="181" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><rect x="194" y="245" width="8" height="8" rx="2" fill="#35d997"/><text x="211" y="253" fill="#c9dce6">Client</text></g><g><rect x="320" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><rect x="333" y="245" width="8" height="8" rx="2" fill="#ffad4f"/><text x="350" y="253" fill="#c9dce6">Nimbus</text></g><g><rect x="459" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><rect x="472" y="245" width="8" height="8" rx="2" fill="#7d74ff"/><text x="489" y="253" fill="#c9dce6">API</text></g><g><rect x="598" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><rect x="611" y="245" width="8" height="8" rx="2" fill="#20c9e7"/><text x="628" y="253" fill="#c9dce6">Cast</text></g><g><rect x="737" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><rect x="750" y="245" width="8" height="8" rx="2" fill="#43dca2"/><text x="767" y="253" fill="#c9dce6">Telemetry</text></g><g><rect x="876" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><rect x="889" y="245" width="8" height="8" rx="2" fill="#43dca2"/><text x="906" y="253" fill="#c9dce6">Analytics</text></g><g><rect x="1015" y="228" width="143" height="42" rx="10" fill="#061722" stroke="#164056"/><rect x="1028" y="245" width="8" height="8" rx="2" fill="#35d997"/><text x="1045" y="253" fill="#c9dce6">Status</text></g></g>
<path id="bus" d="M60 300 H1140" fill="none" stroke="#14465e" stroke-width="3"/><path d="M60 300 H940" fill="none" stroke="url(#cyan)" stroke-width="3" opacity=".46"/><rect width="8" height="8" rx="2" fill="#6bf3ff" filter="url(#g)"><animateMotion dur="5s" repeatCount="indefinite" path="M60 300 H1140"/></rect><rect width="6" height="6" rx="2" fill="#33df9b"><animateMotion dur="7s" begin="2s" repeatCount="indefinite" path="M1140 300 H60"/></rect><g font-family="ui-monospace,Consolas,monospace" font-size="9"><text x="42" y="329" fill="#5e8195">PIPELINE</text><text x="104" y="329" fill="#7b9eb1">RESEARCH → ARCHITECTURE → BUILD → INTEGRATION → SECURITY → TESTING → STABILIZATION → RELEASE PREPARATION</text></g>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#067dff"/><stop offset=".34" stop-color="#32efff"/><stop offset=".62" stop-color="#11bddf"/><stop offset="1" stop-color="#4a65ff"/></linearGradient><rect x="4" y="4" width="1192" height="352" rx="22" fill="none" stroke="#0b3346" stroke-width="1.5"/><rect x="4" y="4" width="1192" height="352" rx="22" fill="none" stroke="url(#border)" stroke-width="3" stroke-dasharray="405 1482" filter="url(#g)" opacity=".9"><animate attributeName="stroke-dashoffset" values="0;-1887" dur="10s" repeatCount="indefinite"/></rect>

<!-- LEVIATHAN_GLOW_BORDER_V1 -->
<defs>
  <linearGradient id="leviathanBorderGradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#067dff"/>
    <stop offset="0.34" stop-color="#32efff"/>
    <stop offset="0.62" stop-color="#11bddf"/>
    <stop offset="1" stop-color="#4a65ff"/>
  </linearGradient>
  <filter id="leviathanBorderGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="4" y="4" width="1192" height="352" rx="22" fill="none" stroke="#0b3346" stroke-width="1.5" opacity="0.9"/>
<rect x="4" y="4" width="1192" height="352" rx="22" fill="none" stroke="url(#leviathanBorderGradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="405 1482" filter="url(#leviathanBorderGlow)" opacity="0.92">
  <animate attributeName="stroke-dashoffset" values="0;-1887" dur="10s" repeatCount="indefinite"/>
