<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020913"/><stop offset=".55" stop-color="#061927"/><stop offset="1" stop-color="#020b13"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a82ff"/><stop offset=".5" stop-color="#32edff"/><stop offset="1" stop-color="#00a9ff"/></linearGradient>
  <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#103148" stroke-width="1" opacity=".24"/></pattern>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<rect width="1200" height="360" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#16394e"/>

<text x="42" y="45" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3">LEVIATHAN COMMAND CORE // DEVELOPMENT HUD</text>
<text x="42" y="70" fill="#789aaf" font-family="Segoe UI,Arial,sans-serif" font-size="12">Public-facing status interface for the Leviathan ecosystem.</text>
<circle cx="1124" cy="42" r="4" fill="#43e49a" filter="url(#g)"><animate attributeName="opacity" values=".3;1;.3" dur="1.5s" repeatCount="indefinite"/></circle>
<text x="1137" y="46" fill="#7598aa" font-family="ui-monospace,Consolas,monospace" font-size="10">ONLINE</text>
<line x1="42" y1="84" x2="1158" y2="84" stroke="#17384c"/>

<!-- primary state cards -->
<g font-family="ui-monospace,Consolas,monospace">
  <g><rect x="42" y="104" width="220" height="76" rx="13" fill="#061722" stroke="#17465e"/><text x="60" y="128" fill="#63869a" font-size="10" letter-spacing="1.2">SYSTEM</text><text x="60" y="155" fill="#effbff" font-size="17" font-weight="700">LEVIATHAN PLATFORM</text></g>
  <g><rect x="280" y="104" width="220" height="76" rx="13" fill="#061722" stroke="#17465e"/><text x="298" y="128" fill="#63869a" font-size="10" letter-spacing="1.2">PHASE</text><text x="298" y="155" fill="#65efff" font-size="17" font-weight="700">STABILIZATION</text></g>
  <g><rect x="518" y="104" width="220" height="76" rx="13" fill="#061722" stroke="#17465e"/><text x="536" y="128" fill="#63869a" font-size="10" letter-spacing="1.2">BASELINE</text><text x="536" y="155" fill="#effbff" font-size="17" font-weight="700">v51.0.6 INTERNAL</text></g>
  <g><rect x="756" y="104" width="180" height="76" rx="13" fill="#061722" stroke="#17465e"/><text x="774" y="128" fill="#63869a" font-size="10" letter-spacing="1.2">SOURCE</text><text x="774" y="155" fill="#45dfa0" font-size="17" font-weight="700">PRIVATE</text></g>
</g>

<!-- orbital core -->
<g transform="translate(1056 142)">
  <circle r="70" fill="none" stroke="#1bbde0" stroke-width="1.5" stroke-dasharray="7 10" opacity=".5"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/></circle>
  <circle r="50" fill="none" stroke="#62ecff" stroke-width="1" stroke-dasharray="3 8" opacity=".7"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/></circle>
  <circle r="25" fill="none" stroke="#1d83b3" stroke-width="1" stroke-dasharray="10 5" opacity=".65"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/></circle>
  <circle r="8" fill="#68f1ff" filter="url(#g)"><animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/></circle>
</g>

<!-- subsystem health row -->
<text x="42" y="212" fill="#5f8296" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.4">SYSTEM AREAS</text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="11">
  <g><rect x="42" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><circle cx="59" cy="249" r="4" fill="#35d997"/><text x="72" y="253" fill="#c9dce6">Launcher</text></g>
  <g><rect x="181" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><circle cx="198" cy="249" r="4" fill="#35d997"/><text x="211" y="253" fill="#c9dce6">Client</text></g>
  <g><rect x="320" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><circle cx="337" cy="249" r="4" fill="#ffad4f"/><text x="350" y="253" fill="#c9dce6">Nimbus</text></g>
  <g><rect x="459" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><circle cx="476" cy="249" r="4" fill="#7d74ff"/><text x="489" y="253" fill="#c9dce6">API</text></g>
  <g><rect x="598" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><circle cx="615" cy="249" r="4" fill="#20c9e7"/><text x="628" y="253" fill="#c9dce6">Cast</text></g>
  <g><rect x="737" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><circle cx="754" cy="249" r="4" fill="#43dca2"/><text x="767" y="253" fill="#c9dce6">Telemetry</text></g>
  <g><rect x="876" y="228" width="128" height="42" rx="10" fill="#061722" stroke="#164056"/><circle cx="893" cy="249" r="4" fill="#43dca2"/><text x="906" y="253" fill="#c9dce6">Analytics</text></g>
  <g><rect x="1015" y="228" width="143" height="42" rx="10" fill="#061722" stroke="#164056"/><circle cx="1032" cy="249" r="4" fill="#35d997"/><text x="1045" y="253" fill="#c9dce6">Status</text></g>
</g>

<!-- animated data bus -->
<path id="bus" d="M60 300 H1140" fill="none" stroke="#14465e" stroke-width="3" stroke-linecap="round"/>
<path d="M60 300 H940" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round" opacity=".46"/>
<circle r="4" fill="#6bf3ff" filter="url(#g)"><animateMotion dur="5s" repeatCount="indefinite" path="M60 300 H1140"/></circle>
<circle r="3" fill="#33df9b"><animateMotion dur="7s" begin="2s" repeatCount="indefinite" path="M1140 300 H60"/></circle>
<g font-family="ui-monospace,Consolas,monospace" font-size="9">
  <text x="42" y="329" fill="#5e8195">PIPELINE</text>
  <text x="104" y="329" fill="#7b9eb1">RESEARCH → ARCHITECTURE → BUILD → INTEGRATION → SECURITY → TESTING → STABILIZATION → RELEASE PREPARATION</text>
</g>
</svg>