<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="b"><stop stop-color="#020914"/><stop offset="1" stop-color="#061827"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="360" rx="26" fill="url(#b)"/><rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#17394d"/><text x="52" y="48" fill="#4ceaff" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="3">LEVIATHAN // PLATFORM AREAS</text><text x="52" y="76" fill="#789cad" font-family="Segoe UI,Arial,sans-serif" font-size="15">Four high-level domains define the public view of the ecosystem.</text><g font-family="Segoe UI,Arial,sans-serif"><g transform="translate(48 120)"><rect width="260" height="150" rx="18" fill="#061a28" stroke="#1b5369"/><circle cx="38" cy="38" r="8" fill="#34eaff" filter="url(#g)"><animate attributeName="r" values="6;9;6" dur="2.1s" repeatCount="indefinite"/></circle><text x="62" y="43" fill="#f2fbff" font-size="18" font-weight="700">Player Software</text><text x="24" y="82" fill="#7f9faf" font-size="12">Launcher • Client • Profiles</text><text x="24" y="105" fill="#7f9faf" font-size="12">Instances • Updates • Customization</text></g><g transform="translate(330 120)"><rect width="260" height="150" rx="18" fill="#061a28" stroke="#1b5369"/><circle cx="38" cy="38" r="8" fill="#7b72ff"><animate attributeName="opacity" values=".4;1;.4" dur="1.8s" repeatCount="indefinite"/></circle><text x="62" y="43" fill="#f2fbff" font-size="18" font-weight="700">Platform</text><text x="24" y="82" fill="#7f9faf" font-size="12">Authentication • APIs • Accounts</text><text x="24" y="105" fill="#7f9faf" font-size="12">Cast • SDK • Integrations</text></g><g transform="translate(612 120)"><rect width="260" height="150" rx="18" fill="#061a28" stroke="#1b5369"/><circle cx="38" cy="38" r="8" fill="#48e6a0"><animate attributeName="opacity" values=".35;1;.35" dur="1.5s" repeatCount="indefinite"/></circle><text x="62" y="43" fill="#f2fbff" font-size="18" font-weight="700">Protection</text><text x="24" y="82" fill="#7f9faf" font-size="12">Nimbus • Security • Integrity</text><text x="24" y="105" fill="#7f9faf" font-size="12">Abuse protection • Reliability</text></g><g transform="translate(894 120)"><rect width="260" height="150" rx="18" fill="#061a28" stroke="#1b5369"/><circle cx="38" cy="38" r="8" fill="#ffb75c"><animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/></circle><text x="62" y="43" fill="#f2fbff" font-size="18" font-weight="700">Observability</text><text x="24" y="82" fill="#7f9faf" font-size="12">Telemetry • Analytics • Logging</text><text x="24" y="105" fill="#7f9faf" font-size="12">Monitoring • Status • Diagnostics</text></g></g><path id="f" d="M308 195H330M590 195H612M872 195H894" stroke="#2a6b82" stroke-width="3"/><circle r="4" fill="#7af6ff" filter="url(#g)"><animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#f"/></animateMotion></circle><text x="52" y="322" fill="#6d94a8" font-family="ui-monospace,Consolas,monospace" font-size="10">SANITIZED PUBLIC DOMAIN MAP // INTERNAL TOPOLOGY AND PRIVATE IMPLEMENTATION ARE NOT SHOWN</text>
