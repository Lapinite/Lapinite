"2" fill="#7d74ff"/><text x="30" y="27" fill="#c9dce6">API / Auth</text></g><g transform="translate(610 226)"><path d="M0 0 H126 L138 12 V48 H0 Z" fill="#061722" stroke="#285d49"/><rect x="13" y="18" width="8" height="8" rx="2" fill="#43dca2"/><text x="30" y="27" fill="#c9dce6">Servers</text></g><g transform="translate(752 226)"><path d="M0 0 H126 L138 12 V48 H0 Z" fill="#061722" stroke="#704c28"/><rect x="13" y="18" width="8" height="8" rx="2" fill="#ffad4f"/><text x="30" y="27" fill="#c9dce6">AntiCheat</text></g><g transform="translate(894 226)"><path d="M0 0 H126 L138 12 V48 H0 Z" fill="#061722" stroke="#45417d"/><rect x="13" y="18" width="8" height="8" rx="2" fill="#7d74ff"/><text x="30" y="27" fill="#c9dce6">Verification</text></g><g transform="translate(1036 226)"><path d="M0 0 H108 L120 12 V48 H0 Z" fill="#061722" stroke="#285d49"/><rect x="13" y="18" width="8" height="8" rx="2" fill="#43dca2"/><text x="30" y="27" fill="#c9dce6">Data / Ops</text></g></g><g transform="translate(42 302)"><path id="bus" d="M0 22 H1116" fill="none" stroke="#14465e" stroke-width="3"/><path d="M0 22 H1116" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-dasharray="64 28" opacity=".5"><animate attributeName="stroke-dashoffset" values="0;-184" dur="4.2s" repeatCount="indefinite"/></path><rect width="8" height="8" rx="2" fill="#6bf3ff" filter="url(#g)"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#bus"/></animateMotion></rect><rect width="6" height="6" rx="2" fill="#ffb45e"><animateMotion dur="7s" begin="2s" repeatCount="indefinite" path="M1116 22 H0"/></rect><path d="M0 54 H1116" stroke="#15384a"/><text x="0" y="82" fill="#5e8195" font-family="ui-monospace,Consolas,monospace" font-size="9">RESEARCH → DESIGN → BUILD → INTEGRATE → VERIFY → OBSERVE → HARDEN → RELEASE</text></g><g transform="translate(42 414)" font-family="ui-monospace,Consolas,monospace" font-size="8.5"><text x="0" y="0" fill="#587e91">SYSTEM SIGNAL</text><path d="M90 -4 H720" stroke="#173c50" stroke-width="2"/><path d="M90 -4 H540" stroke="#41e7f7" stroke-width="2" stroke-dasharray="18 10"><animate attributeName="stroke-dashoffset" values="0;-56" dur="2.4s" repeatCount="indefinite"/></path><text x="750" y="0" fill="#4deca8">ACTIVE DEVELOPMENT</text><text x="905" y="0" fill="#587e91">STATUS</text><text x="958" y="0" fill="#ffad56">TRACKED PER PRODUCT</text></g><text x="42" y="449" fill="#587e91" font-family="ui-monospace,Consolas,monospace" font-size="9">PUBLIC OVERVIEW ONLY // PRIVATE IMPLEMENTATION, CREDENTIALS AND SENSITIVE SECURITY DETAILS ARE EXCLUDED</text><rect x="4" y="4" width="1192" height="462" rx="22" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-dasharray="440 1604" filter="url(#g)" opacity=".88"><animate attributeName="stroke-dashoffset" values="0;-2044" dur="10s" repeatCount="indefinite"/></rect></svg>