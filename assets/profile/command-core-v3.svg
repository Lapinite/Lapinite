<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020813"/><stop offset=".55" stop-color="#061725"/><stop offset="1" stop-color="#020a12"/></linearGradient><linearGradient id="cyan"><stop stop-color="#0b7dff"/><stop offset=".5" stop-color="#2deaff"/><stop offset="1" stop-color="#04b1e9"/></linearGradient><linearGradient id="amber"><stop stop-color="#ff9b2e"/><stop offset=".5" stop-color="#ffd07a"/><stop offset="1" stop-color="#ff8a1c"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#103148" opacity=".22"/></pattern></defs><rect width="1200" height="470" rx="24" fill="url(#bg)"/><rect width="1200" height="470" rx="24" fill="url(#grid)"/><text x="42" y="43" fill="#59eaff" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3">LEVIATHAN COMMAND CORE // PROJECT OVERVIEW</text><text x="42" y="68" fill="#7f9eb2" font-family="Segoe UI,Arial,sans-serif" font-size="12">A high-level view of a multi-project ecosystem. Exact build and release state is tracked by each product.</text><line x1="42" y1="82" x2="1158" y2="82" stroke="#17384c"/><g font-family="ui-monospace,Consolas,monospace"><g><path d="M42 102 H250 L264 116 V174 H42 Z" fill="#061722" stroke="#17465e"/><text x="59" y="126" fill="#63869a" font-size="10">DEVELOPMENT</text><text x="59" y="153" fill="#63efff" font-size="17" font-weight="700">MULTI-PROJECT</text></g><g><path d="M280 102 H490 L504 116 V174 H280 Z" fill="#061722" stroke="#17465e"/><text x="297" y="126" fill="#63869a" font-size="10">VISIBILITY</text><text x="297" y="153" fill="#effbff" font-size="17" font-weight="700">PUBLIC + PRIVATE</text></g><g><path d="M520 102 H745 L759 116 V174 H520 Z" fill="