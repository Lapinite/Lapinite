  <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="line"><stop offset="0" stop-color="#0b7fff"/><stop offset="1" stop-color="#35ecff"/></linearGradient>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="558" rx="23" fill="none" stroke="#14354c"/>
<text x="42" y="48" fill="#54e9ff" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3">LEVIATHAN NEURAL CORE // PUBLIC SYSTEM MAP</text>
<text x="42" y="78" fill="#86a6ba" font-family="Segoe UI,Arial" font-size="12">High-level public architecture only. Private topology, source and internal endpoints are intentionally excluded.</text>

<g fill="none" stroke="url(#line)" stroke-width="2" opacity=".42">
  <path id="p1" d="M600 285 C500 205 405 175 300 155"/><path id="p2" d="M600 285 C470 285 350 285 230 285"/>
  <path id="p3" d="M600 285 C500 365 405 395 300 415"/><path id="p4" d="M600 285 C700 205 795 175 900 155"/>
  <path id="p5" d="M600 285 C730 285 850 285 970 285"/><path id="p6" d="M600 285 C700 365 795 395 900 415"/>
  <path d="M300 155 C260 195 245 235 230 285"/><path d="M230 285 C245 335 260 375 300 415"/>
  <path d="M900 155 C940 195 955 235 970 285"/><path d="M970 285 C955 335 940 375 900 415"/>
</g>

<g fill="#32e6ff" filter="url(#g)">
  <circle r="4"><animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="4"><animateMotion dur="5.6s" repeatCount="indefinite" begin="1s"><mpath href="#p2"/></animateMotion></circle>
  <circle r="4"><animateMotion dur="5.1s" repeatCount="indefinite" begin="2s"><mpath href="#p3"/></animateMotion></circle>
  <circle r="4"><animateMotion dur="4.5s" repeatCount="indefinite" begin=".6s"><mpath href="#p4"/></animateMotion></circle>
  <circle r="4"><animateMotion dur="5.4s" repeatCount="indefinite" begin="1.7s"><mpath href="#p5"/></animateMotion></circle>
  <circle r="4"><animateMotion dur="4.9s" repeatCount="indefinite" begin="2.4s"><mpath href="#p6"/></animateMotion></circle>
</g>

<g font-family="Segoe UI,Arial" text-anchor="middle">
  <g><circle cx="600" cy="285" r="68" fill="#071b2a" stroke="#39e8ff" stroke-width="2.5" filter="url(#g)"/><circle cx="600" cy="285" r="50" fill="none" stroke="#1eaee8" stroke-dasharray="5 8"><animateTransform attributeName="transform" type="rotate" from="0 600 285" to="360 600 285" dur="13s" repeatCount="indefinite"/></circle><text x="600" y="278" fill="#f1fbff" font-size="22" font-weight="800">LEVIATHAN</text><text x="600" y="300" fill="#63ddec" font-size="12">CORE PLATFORM</text></g>

  <g transform="translate(300 155)"><circle r="52" fill="#071823" stroke="#1ba9d3"/><text y="-5" fill="#eaf9ff" font-size="17" font-weight="700">LAUNCHER</text><text y="16" fill="#759bb0" font-size="11">PLAYER SOFTWARE</text></g>
  <g transform="translate(230 285)"><circle r="52" fill="#071823" stroke="#1ba9d3"/><text y="-5" fill="#eaf9ff" font-size="17" font-weight="700">CLIENT</text><text y="16" fill="#759bb0" font-size="11">GAME SYSTEMS</text></g>
  <g transform="translate(300 415)"><circle r="52" fill="#071823" stroke="#1ba9d3"/><text y="-5" fill="#eaf9ff" font-size="17" font-weight="700">CAST</text><text y="16" fill="#759bb0" font-size="11">CONNECTED DEVICES</text></g>

  <g transform="translate(900 155)"><circle r="52" fill="#071823" stroke="#7f73ff"/><text y="-5" fill="#eaf9ff" font-size="17" font-weight="700">AUTH</text><text y="16" fill="#8f9ac2" font-size="11">IDENTITY</text></g>
  <g transform="translate(970 285)"><circle r="52" fill="#071823" stroke="#7f73ff"/><text y="-5" fill="#eaf9ff" font-size="17" font-weight="700">API</text><text y="16" fill="#8f9ac2" font-size="11">PLATFORM SERVICES</text></g>
  <g transform="translate(900 415)"><circle r="52" fill="#071823" stroke="#7f73ff"/><text y="-5" fill="#eaf9ff" font-size="17" font-weight="700">STATUS</text><text y="16" fill="#8f9ac2" font-size="11">RELIABILITY</text></g>

  <g transform="translate(600 125)"><rect x="-110" y="-30" width="220" height="60" rx="14" fill="#071823" stroke="#ff9d3a"/><text y="-4" fill="#fff2e2" font-size="17" font-weight="700">NIMBUS + SECURITY</text><text y="17" fill="#ba9570" font-size="11">PROTECTION LAYER</text></g>
  <g transform="translate(600 445)"><rect x="-125" y="-30" width="250" height="60" rx="14" fill="#071823" stroke="#39c98b"/><text y="-4" fill="#effff8" font-size="17" font-weight="700">TELEMETRY + ANALYTICS</text><text y="17" fill="#79ad99" font-size="11">OBSERVABILITY</text></g>
