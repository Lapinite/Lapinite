<g fill="none" stroke="#ff9d3a" stroke-width="1.5" opacity=".35"><path d="M600 155 L600 217"/><path d="M600 353 L600 415"/></g>
<circle cx="600" cy="217" r="3" fill="#ffb25b"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="600" cy="415" r="3" fill="#57e5a5"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
