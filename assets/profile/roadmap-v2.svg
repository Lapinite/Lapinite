ation</text></g><g transform="translate(66 356)"><path d="M34 0 L52 18 L34 36 L16 18 Z" fill="#071a25" stroke="#24c9e3" stroke-width="3"/><rect x="76" y="-6" width="1016" height="50" rx="10" fill="#06131e" stroke="#16394d"/><text x="98" y="12" fill="#5f8ca4" font-family="ui-monospace,Consolas,monospace" font-size="9">WORKSTREAM 04</text><text x="98" y="33" fill="#eaf8ff" font-size="16" font-weight="750">INTEGRATION</text><text x="302" y="32" fill="#83a1b3" font-size="11">Authentication, APIs, server links, devices, Discord, website and cross-product flows</text></g><g transform="translate(66 412)"><path d="M34 0 L52 18 L34 36 L16 18 Z" fill="#071a25" stroke="#ffae55" stroke-width="3"/><rect x="76" y="-6" width="1016" height="50" rx="10" fill="#06131e" stroke="#4f402b"/><text x="98" y="12" fill="#9e7a4e" font-family="ui-monospace,Consolas,monospace" font-size="9">WORKSTREAM 05</text><text x="98" y="33" fill="#ffd18b" font-size="16" font-weight="750">SECURITY &amp; INTEGRITY</text><text x="302" y="32" fill="#83a1b3" font-size="11">AntiCheat, abuse controls, privacy, diagnostics, verification and threat hardening</text></g><g transform="translate(66 468)"><path d="M34 0 L52 18 L34 36 L16 18 Z" fill="#071a25" stroke="#43d9a3" stroke-width="3"/><rect x="76" y="-6" width="1016" height="50" rx="10" fill="#06131e" stroke="#285b4a"/><text x="98" y="12" fill="#67a48a" font-family="ui-monospace,Consolas,monospace" font-size="9">WORKSTREAM 06</text><text x="98" y="33" fill="#baf4d7" font-size="16" font-weight="750">TEST &amp; VALIDATE</text><text x="302" y="32" fill="#83a1b3" font-size="11">Compatibility, failure recovery, regression testing, UX checks and real-device validation</text></g><g transform="translate(66 524)"><path d="M34 0 L52 18 L34 36 L16 18 Z" fill="#071a25" stroke="#8174ff" stroke-width="3"/><rect x="76" y="-6" width="1016" height="50" rx="10" fill="#06131e" stroke="#45417d"/><text x="98" y="12" fill="#7772bd" font-family="ui-monospace,Consolas,monospace" font-size="9">WORKSTREAM 07</text><text x="98" y="33" fill="#c5c1ff" font-size="16" font-weight="750">OPERATE &amp; OBSERVE</text><text x="302" y="32" fill="#83a1b3" font-size="11">Telemetry, analytics, status, incidents, support, logs and release operations</text></g><g transform="translate(66 580)"><path d="M34 0 L52 18 L34 36 L16 18 Z" fill="#071a25" stroke="#69f1ff" stroke-width="3" filter="url(#g)"/><rect x="76" y="-6" width="1016" height="50" rx="10" fill="#071a25" stroke="#2a6b82"/><text x="98" y="12" fill="#5f8ca4" font-family="ui-monospace,Consolas,monospace" font-size="9">WORKSTREAM 08</text><text x="98" y="33" fill="#69f1ff" font-size="16" font-weight="750">RELEASE &amp; IMPROVE</text><text x="302" y="32" fill="#83a1b3" font-size="11">Signing, distribution, documentation, migration, feedback and iterative improvement</text></g></g><text x="42" y="662" fill="#6d94a8" font-family="ui-monospace,Consolas,monospace" font-size="10">PIPELINE OVERVIEW // STATUS IS PRODUCT-SPECIFIC // PRIVATE SECURITY AND INFRASTRUCTURE DETAILS ARE EXCLUDED</text><rect x="4" y="4" width="1192" height="682" rx="22" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-dasharray="490 2258" filter="url(#g)" opacity=".86"><animate attributeName="stroke-dashoffset" values="0;-2748" dur="11s" repeatCount="indefinite"/></rect></svg>