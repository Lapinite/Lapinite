<!-- economy/cosmetics -->
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
  <g><rect x="120" y="590" width="250" height="95" rx="15" fill="#061722" stroke="#aa78ff"/><text x="245" y="621" fill="#eefcff" font-size="16" font-weight="750">COSMETICS SERVICE</text><text x="245" y="646" fill="#8ba7b7" font-size="10">catalog • ownership • equipped state</text><text x="245" y="665" fill="#688a9d" font-size="9.5">client/launcher/web/mobile presentation</text></g>
  <g><rect x="475" y="590" width="250" height="95" rx="15" fill="#061722" stroke="#ffd56a"/><text x="600" y="621" fill="#fff3c9" font-size="16" font-weight="750">LEVICOINS / WALLET</text><text x="600" y="646" fill="#b2a071" font-size="10">balance ledger • grants • spends • adjustments</text><text x="600" y="665" fill="#857a58" font-size="9.5">virtual economy direction, not payment-card storage</text></g>
  <g><rect x="830" y="590" width="250" height="95" rx="15" fill="#061722" stroke="#43d9a3"/><text x="955" y="621" fill="#eefcff" font-size="16" font-weight="750">GROWTH + ATTRIBUTION</text><text x="955" y="646" fill="#8ba7b7" font-size="10">referrals • creators • campaigns • rewards</text><text x="955" y="665" fill="#688a9d" font-size="9.5">analytics and anti-abuse boundaries</text></g>
</g>
<g fill="none" stroke-width="1.5" opacity=".6"><path id="e1" d="M960 533 Q820 570 725 620" stroke="#b18d36"/><path id="e2" d="M960 533 Q620 555 370 620" stroke="#8d66c6"/><path id="e3" d="M755 533 Q880 565 955 590" stroke="#348f70"/><path id="e4" d="M600 378 V590" stroke="#176987" stroke-dasharray="5 8"/></g>
<g filter="url(#glow)"><circle r="4" fill="#ffd56a"><animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle><circle r="4" fill="#bf95ff"><animateMotion dur="6s" begin="1s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle><circle r="4" fill="#54e4ae"><animateMotion dur="5s" begin=".6s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle><circle r="4" fill="#58eaff"><animateMotion dur="4.7s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle></g>

<text x="600" y="718" text-anchor="middle" fill="#5f8194" font-family="ui-monospace,Consolas,monospace" font-size="10">DIRECTIONAL PUBLIC MODEL • PAYMENT CREDENTIALS STAY WITH THE PAYMENT PROVIDER • PRIVATE SCHEMAS AND FRAUD LOGIC EXCLUDED</text>
</svg>