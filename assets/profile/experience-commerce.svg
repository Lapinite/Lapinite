  <g><rect x="285" y="120" width="200" height="88" rx="15" fill="#061722" stroke="#22bddb"/><text x="385" y="152" fill="#eefcff" font-size="17" font-weight="750">MOBILE APP</text><text x="385" y="178" fill="#88a7b7" font-size="10">account • cosmetics • Cast • alerts</text></g>
  <g><rect x="715" y="120" width="200" height="88" rx="15" fill="#061722" stroke="#22bddb"/><text x="815" y="152" fill="#eefcff" font-size="17" font-weight="750">LAUNCHER</text><text x="815" y="178" fill="#88a7b7" font-size="10">profiles • instances • store state</text></g>
  <g><rect x="945" y="120" width="200" height="88" rx="15" fill="#061722" stroke="#22bddb"/><text x="1045" y="152" fill="#eefcff" font-size="17" font-weight="750">CLIENT</text><text x="1045" y="178" fill="#88a7b7" font-size="10">cosmetics • entitlements • gameplay UX</text></g>
</g>

<!-- platform core -->
<circle cx="600" cy="290" r="88" fill="#061a28" stroke="#35e8f8" stroke-width="2.5" filter="url(#glow)"/>
<circle cx="600" cy="290" r="65" fill="none" stroke="#168fb6" stroke-dasharray="5 8"><animateTransform attributeName="transform" type="rotate" from="0 600 290" to="360 600 290" dur="14s" repeatCount="indefinite"/></circle>
<text x="600" y="278" text-anchor="middle" fill="#effcff" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">LEVIATHAN</text>
<text x="600" y="302" text-anchor="middle" fill="#62dce9" font-family="ui-monospace,Consolas,monospace" font-size="10">AUTH • API • ACCOUNT STATE</text>
<text x="600" y="322" text-anchor="middle" fill="#668a9d" font-family="Segoe UI,Arial,sans-serif" font-size="9">public-safe platform boundary</text>

<!-- surface paths -->
<g fill="none" stroke="#176987" stroke-width="1.7" opacity=".58">
  <path id="w" d="M155 208 Q330 245 513 277"/><path id="m" d="M385 208 Q480 240 520 265"/>
  <path id="l" d="M815 208 Q720 240 680 265"/><path id="c" d="M1045 208 Q870 245 687 277"/>
</g>
<g fill="#63f2ff" filter="url(#glow)"><circle r="4"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#w"/></animateMotion></circle><circle r="4"><animateMotion dur="4.6s" begin=".7s" repeatCount="indefinite"><mpath href="#m"/></animateMotion></circle><circle r="4"><animateMotion dur="4.8s" begin="1.2s" repeatCount="indefinite"><mpath href="#l"/></animateMotion></circle><circle r="4"><animateMotion dur="5.2s" begin="1.7s" repeatCount="indefinite"><mpath href="#c"/></animateMotion></circle></g>

<!-- commerce lane -->
<text x="42" y="420" fill="#6f93a6" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.4">COMMERCE + ENTITLEMENT FLOW</text>
<path id="commerce" d="M100 490 H1095" fill="none" stroke="#5a4a21" stroke-width="5" stroke-linecap="round" opacity=".6"/>
<circle r="5" fill="#ffd56a" filter="url(#glow)"><animateMotion dur="10s" repeatCount="indefinite"><mpath href="#commerce"/></animateMotion></circle>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
  <g><rect x="55" y="447" width="170" height="86" rx="14" fill="#15140d" stroke="#d8a531"/><text x="140" y="478" fill="#fff3c9" font-size="15" font-weight="750">STORE / CATALOG</text><text x="140" y="502" fill="#af9b67" font-size="10">cosmetics • bundles • plans</text></g>
  <g><rect x="260" y="447" width="170" height="86" rx="14" fill="#15140d" stroke="#d8a531"/><text x="345" y="478" fill="#fff3c9" font-size="15" font-weight="750">CHECKOUT</text><text x="345" y="502" fill="#af9b67" font-size="10">price • tax • order intent</text></g>
  <g><rect x="465" y="447" width="170" height="86" rx="14" fill="#15140d" stroke="#d8a531"/><text x="550" y="472" fill="#fff3c9" font-size="14" font-weight="750">PAYMENT</text><text x="550" y="489" fill="#fff3c9" font-size="14" font-weight="750">PROVIDER</text><text x="550" y="508" fill="#af9b67" font-size="9.5">external card/payment boundary</text></g>
  <g><rect x="670" y="447" width="170" height="86" rx="14" fill="#15140d" stroke="#d8a531"/><text x="755" y="478" fill="#fff3c9" font-size="15" font-weight="750">ORDER VERIFY</text><text x="755" y="502" fill="#af9b67" font-size="10">provider event • fraud checks</text></g>
  <g><rect x="875" y="447" width="170" height="86" rx="14" fill="#15140d" stroke="#d8a531"/><text x="960" y="478" fill="#fff3c9" font-size="15" font-weight="750">ENTITLEMENT</text><text x="960" y="502" fill="#af9b67" font-size="10">grant • revoke • refund state</text></g>
