<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020913"/><stop offset=".58" stop-color="#061725"/><stop offset="1" stop-color="#020b13"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#087dff"/><stop offset=".5" stop-color="#2be8ff"/><stop offset="1" stop-color="#00a8ff"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c98b28"/><stop offset=".5" stop-color="#ffd56a"/><stop offset="1" stop-color="#d8a531"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#12364b" stroke-width="1" opacity=".18"/></pattern>
</defs>
<rect width="1200" height="760" rx="24" fill="url(#bg)"/><rect width="1200" height="760" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="758" rx="23" fill="none" stroke="#173b51"/>
<text x="42" y="46" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3">LEVIATHAN EXPERIENCE + COMMERCE // PUBLIC DIRECTION</text>
<text x="42" y="72" fill="#7d9fb2" font-family="Segoe UI,Arial,sans-serif" font-size="12">Website, mobile, launcher/client, cosmetics, LeviCoins, payments, entitlements and connected platform flows.</text>

<!-- user surfaces -->
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
