<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01060d"/><stop offset=".52" stop-color="#061827"/><stop offset="1" stop-color="#020a12"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0787ff"/><stop offset=".5" stop-color="#38efff"/><stop offset="1" stop-color="#00a7ff"/></linearGradient>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6fcff"/><stop offset=".45" stop-color="#f6fcff"/><stop offset=".55" stop-color="#7cf7ff"/><stop offset=".65" stop-color="#f6fcff"/><stop offset="1" stop-color="#f6fcff"/><animate attributeName="x1" values="-1;1" dur="7s" repeatCount="indefinite"/><animate attributeName="x2" values="0;2" dur="7s" repeatCount="indefinite"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#55eeff" stop-opacity=".72"/><stop offset=".35" stop-color="#05bfe7" stop-opacity=".22"/><stop offset="1" stop-color="#006cff" stop-opacity="0"/></radialGradient>
  <linearGradient id="serpent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#31efff"/><stop offset="1" stop-color="#0b73ff"/></linearGradient>
  <filter id="glow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#113149" stroke-width="1" opacity=".27"/></pattern>
  <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#17415a" opacity=".25"/></pattern>
</defs>

<rect width="1200" height="460" rx="28" fill="url(#bg)"/>
<rect width="1200" height="460" rx="28" fill="url(#grid)"/>
<rect width="1200" height="460" rx="28" fill="url(#micro)"/>
<rect x="1" y="1" width="1198" height="458" rx="27" fill="none" stroke="#17394f"/>

<!-- animated current lines -->
<g fill="none" stroke="#0c6f94" stroke-width="1.2" opacity=".23" stroke-dasharray="10 18">
  <path d="M676 95 C760 55 851 63 923 104 C995 145 1082 140 1164 98"><animate attributeName="stroke-dashoffset" values="0;-140" dur="9s" repeatCount="indefinite"/></path>
  <path d="M676 126 C755 93 847 101 916 139 C990 180 1075 178 1164 138"><animate attributeName="stroke-dashoffset" values="0;-140" dur="11s" repeatCount="indefinite"/></path>
  <path d="M686 336 C770 376 860 374 930 337 C998 302 1080 302 1162 341"><animate attributeName="stroke-dashoffset" values="0;140" dur="10s" repeatCount="indefinite"/></path>
</g>

<!-- top system rail -->
<g font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.4">
  <text x="54" y="31" fill="#557b90">SYSTEM</text><text x="111" y="31" fill="#51eafa">LEVIATHAN</text>
  <text x="248" y="31" fill="#557b90">MODE</text><text x="295" y="31" fill="#9cc7d8">INTERNAL DEVELOPMENT</text>
  <text x="522" y="31" fill="#557b90">BASELINE</text><text x="593" y="31" fill="#9cc7d8">v51.0.6</text>
  <text x="719" y="31" fill="#557b90">STATE</text><text x="763" y="31" fill="#56efaa">STABILIZATION</text>
  <circle cx="1124" cy="27" r="4" fill="#4ef2a8" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="1138" y="31" fill="#77a1b6">ONLINE</text>
</g>
<line x1="42" y1="47" x2="1158" y2="47" stroke="#15384d"/>
<circle r="3" fill="#5ef5ff" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" path="M60 47 H1140"/></circle>

<!-- left identity block -->
<rect x="58" y="92" width="7" height="238" rx="3.5" fill="url(#cyan)" filter="url(#glow)"/>
<text x="95" y="120" fill="#58ecff" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="4">LEVIATHAN // COMMAND INTERFACE</text>
<text x="92" y="201" fill="url(#titleGrad)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="74" font-weight="850" letter-spacing="1">LEVIATHAN</text>
<text x="95" y="239" fill="#b2c8d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Minecraft software, security, services and developer tooling.</text>

<!-- capability rail -->
<g font-family="ui-monospace,Consolas,monospace" font-size="12" letter-spacing="1.1">
  <text x="95" y="280" fill="#6e91a5">LAUNCHER</text><circle cx="168" cy="276" r="3" fill="#2ee9ff"/>
  <text x="185" y="280" fill="#6e91a5">CLIENT</text><circle cx="241" cy="276" r="3" fill="#2ee9ff"/>
  <text x="258" y="280" fill="#6e91a5">PLATFORM</text><circle cx="337" cy="276" r="3" fill="#2ee9ff"/>
  <text x="354" y="280" fill="#6e91a5">NIMBUS</text><circle cx="415" cy="276" r="3" fill="#2ee9ff"/>
  <text x="432" y="280" fill="#6e91a5">API</text><circle cx="461" cy="276" r="3" fill="#2ee9ff"/>
  <text x="478" y="280" fill="#6e91a5">CAST</text><circle cx="517" cy="276" r="3" fill="#2ee9ff"/>
  <text x="534" y="280" fill="#6e91a5">TELEMETRY</text>
</g>

<!-- development state strip -->
<rect x="94" y="304" width="540" height="64" rx="13" fill="#061621" stroke="#163d53"/>
<circle cx="117" cy="330" r="5" fill="#49efaa" filter="url(#glow)"><animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/></circle>
<text x="136" y="326" fill="#79a0b5" font-family="ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1.1">CURRENT PHASE</text>
<text x="136" y="347" fill="#effbff" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">STABILIZATION + VALIDATION</text>
<text x="405" y="326" fill="#79a0b5" font-family="ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1.1">SOURCE</text>
<text x="405" y="347" fill="#effbff" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">PRIVATE</text>
<g transform="translate(555 318)"><rect width="58" height="8" rx="4" fill="#102c3d"/><rect width="42" height="8" rx="4" fill="#20dca4"><animate attributeName="width" values="34;46;34" dur="3.4s" repeatCount="indefinite"/></rect><text x="0" y="31" fill="#63879a" font-family="ui-monospace,Consolas,monospace" font-size="8">VALIDATING</text></g>

<!-- Leviathan core -->
<circle cx="950" cy="223" r="202" fill="url(#halo)" opacity=".5"><animate attributeName="opacity" values=".22;.6;.22" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="950" cy="223" r="144" fill="none" stroke="#0abbe2" stroke-width="1.5" stroke-dasharray="5 12" opacity=".48"><animateTransform attributeName="transform" type="rotate" from="0 950 223" to="360 950 223" dur="22s" repeatCount="indefinite"/></circle>
<circle cx="950" cy="223" r="115" fill="none" stroke="#51ecff" stroke-width="1" stroke-dasharray="2 8" opacity=".6"><animateTransform attributeName="transform" type="rotate" from="360 950 223" to="0 950 223" dur="15s" repeatCount="indefinite"/></circle>
<circle cx="950" cy="223" r="84" fill="none" stroke="#157fb8" stroke-width="1" stroke-dasharray="14 6" opacity=".55"><animateTransform attributeName="transform" type="rotate" from="0 950 223" to="360 950 223" dur="30s" repeatCount="indefinite"/></circle>
<path id="serpentPath" d="M870 174 C912 136 991 142 1029 184 C1058 216 1041 254 1007 267 C968 282 923 261 914 231 C907 205 926 187 949 189 C975 191 989 211 983 232 C978 251 954 258 936 249" fill="none" stroke="url(#serpent)" stroke-width="9" stroke-linecap="round" opacity=".9" filter="url(#glow)"/>
<path d="M862 166 L879 171 L870 188 Z" fill="#4beeff" opacity=".92"/>
<circle cx="870" cy="175" r="3" fill="#e8feff" filter="url(#glow)"/>
<circle r="4" fill="#8ef7ff" filter="url(#glow)"><animateMotion dur="4.6s" repeatCount="indefinite"><mpath href="#serpentPath"/></animateMotion></circle>
<circle r="2.5" fill="#4cf0b1"><animateMotion dur="7s" begin="1.2s" repeatCount="indefinite" path="M950 79 A144 144 0 1 1 949 79"/></circle>

<!-- orbit nodes -->
<g font-family="ui-monospace,Consolas,monospace" font-size="9" text-anchor="middle">
  <g><circle cx="950" cy="72" r="5" fill="#4beaff" filter="url(#glow)"/><text x="950" y="56" fill="#6f9caf">SECURITY</text></g>
  <g><circle cx="1097" cy="168" r="5" fill="#7770ff" filter="url(#glow)"/><text x="1097" y="151" fill="#6f9caf">PLATFORM</text></g>
  <g><circle cx="1053" cy="352" r="5" fill="#43dca2" filter="url(#glow)"/><text x="1053" y="372" fill="#6f9caf">OBSERVABILITY</text></g>
  <g><circle cx="796" cy="326" r="5" fill="#28cbe7" filter="url(#glow)"/><text x="796" y="347" fill="#6f9caf">PLAYER</text></g>
</g>
<g stroke="#1b607c" stroke-width="1" opacity=".45"><line x1="950" y1="88" x2="950" y2="112"/><line x1="1082" y1="177" x2="1050" y2="189"/><line x1="1040" y1="338" x2="1016" y2="309"/><line x1="810" y1="314" x2="842" y2="287"/></g>

<!-- scanner and signal bars -->
<rect x="715" y="78" width="455" height="1" fill="#50efff" opacity=".18"><animate attributeName="y" values="78;366;78" dur="7s" repeatCount="indefinite"/></rect>
<g transform="translate(718 370)" fill="#1f7898" opacity=".6">
  <rect x="0" y="16" width="5" height="8" rx="2"><animate attributeName="height" values="8;18;8" attributeType="XML" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="16;6;16" dur="1.8s" repeatCount="indefinite"/></rect>
  <rect x="10" y="12" width="5" height="12" rx="2"><animate attributeName="height" values="12;23;12" dur="2.2s" repeatCount="indefinite"/><animate attributeName="y" values="12;1;12" dur="2.2s" repeatCount="indefinite"/></rect>
  <rect x="20" y="8" width="5" height="16" rx="2"><animate attributeName="height" values="16;9;16" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="8;15;8" dur="1.6s" repeatCount="indefinite"/></rect>
  <rect x="30" y="14" width="5" height="10" rx="2"><animate attributeName="height" values="10;21;10" dur="2.5s" repeatCount="indefinite"/><animate attributeName="y" values="14;3;14" dur="2.5s" repeatCount="indefinite"/></rect>
</g>

<!-- footer rail -->
<line x1="42" y1="400" x2="1158" y2="400" stroke="#15384d"/>
<g font-family="ui-monospace,Consolas,monospace" font-size="9" letter-spacing="1">
  <text x="54" y="426" fill="#537b91">PUBLIC SURFACE</text><text x="155" y="426" fill="#7aa5b9">PROFILE / DOCS / SDK / API DOCS / EXAMPLES / INTEGRATIONS / STATUS</text>
  <text x="1015" y="426" fill="#537b91">SIGNAL</text>
  <circle cx="1078" cy="423" r="3" fill="#52efff"><animate attributeName="opacity" values=".2;1;.2" dur="1.3s" repeatCount="indefinite"/></circle>
  <text x="1090" y="426" fill="#7aa5b9">NOMINAL</text>
</g>

<!-- LEVIATHAN_GLOW_BORDER_V2 -->
<linearGradient id="leviathanBorderGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#067dff"/><stop offset=".34" stop-color="#32efff"/><stop offset=".62" stop-color="#11bddf"/><stop offset="1" stop-color="#4a65ff"/></linearGradient>
<filter id="leviathanBorderGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<rect x="4" y="4" width="1192" height="452" rx="26" fill="none" stroke="#0b3346" stroke-width="1.5" opacity=".9"/>
<rect x="4" y="4" width="1192" height="452" rx="26" fill="none" stroke="url(#leviathanBorderGradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="430 1570" filter="url(#leviathanBorderGlow)" opacity=".92"><animate attributeName="stroke-dashoffset" values="0;-2000" dur="8s" repeatCount="indefinite"/></rect>
<rect x="12" y="12" width="1176" height="436" rx="18" fill="none" stroke="#27dff5" stroke-width=".7" stroke-dasharray="2 12" opacity=".2"><animate attributeName="stroke-dashoffset" values="0;28" dur="5s" repeatCount="indefinite"/></rect>
</svg>