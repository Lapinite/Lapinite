<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01070f"/><stop offset=".5" stop-color="#061827"/><stop offset="1" stop-color="#020a12"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0787ff"/><stop offset=".5" stop-color="#38efff"/><stop offset="1" stop-color="#00a7ff"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#55eeff" stop-opacity=".7"/><stop offset=".35" stop-color="#05bfe7" stop-opacity=".22"/><stop offset="1" stop-color="#006cff" stop-opacity="0"/></radialGradient>
  <linearGradient id="serpent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#31efff"/><stop offset="1" stop-color="#0b73ff"/></linearGradient>
  <filter id="glow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#113149" stroke-width="1" opacity=".27"/></pattern>
  <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#17415a" opacity=".25"/></pattern>
</defs>

<rect width="1200" height="430" rx="28" fill="url(#bg)"/>
<rect width="1200" height="430" rx="28" fill="url(#grid)"/>
<rect width="1200" height="430" rx="28" fill="url(#micro)"/>
<rect x="1" y="1" width="1198" height="428" rx="27" fill="none" stroke="#17394f"/>

<!-- top system rail -->
<g font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.4">
  <text x="54" y="31" fill="#557b90">SYSTEM</text><text x="111" y="31" fill="#51eafa">LEVIATHAN</text>
  <text x="248" y="31" fill="#557b90">MODE</text><text x="295" y="31" fill="#9cc7d8">INTERNAL DEVELOPMENT</text>
  <text x="522" y="31" fill="#557b90">BASELINE</text><text x="593" y="31" fill="#9cc7d8">v51.0.6</text>
  <text x="719" y="31" fill="#557b90">STATE</text><text x="763" y="31" fill="#56efaa">STABILIZATION</text>
  <circle cx="1124" cy="27" r="4" fill="#4ef2a8" filter="url(#glow)"><animate attributeName="opacity" values=".45;1;.45" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="1138" y="31" fill="#77a1b6">ONLINE</text>
</g>
<line x1="42" y1="47" x2="1158" y2="47" stroke="#15384d"/>

<!-- left title block -->
<rect x="58" y="92" width="7" height="230" rx="3.5" fill="url(#cyan)" filter="url(#glow)"/>
<text x="95" y="120" fill="#58ecff" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="4">LEVIATHAN // COMMAND INTERFACE</text>
<text x="92" y="200" fill="#f4fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="74" font-weight="850" letter-spacing="1">LEVIATHAN</text>
<text x="95" y="239" fill="#b2c8d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Minecraft software, security, services and developer tooling.</text>

<!-- animated capability rail -->
<g font-family="ui-monospace,Consolas,monospace" font-size="12" letter-spacing="1.2">
  <text x="95" y="282" fill="#6e91a5">LAUNCHER</text><circle cx="168" cy="278" r="3" fill="#2ee9ff"/>
  <text x="185" y="282" fill="#6e91a5">CLIENT</text><circle cx="241" cy="278" r="3" fill="#2ee9ff"/>
  <text x="258" y="282" fill="#6e91a5">PLATFORM</text><circle cx="337" cy="278" r="3" fill="#2ee9ff"/>
  <text x="354" y="282" fill="#6e91a5">NIMBUS</text><circle cx="415" cy="278" r="3" fill="#2ee9ff"/>
  <text x="432" y="282" fill="#6e91a5">API</text><circle cx="461" cy="278" r="3" fill="#2ee9ff"/>
  <text x="478" y="282" fill="#6e91a5">CAST</text><circle cx="517" cy="278" r="3" fill="#2ee9ff"/>
  <text x="534" y="282" fill="#6e91a5">TELEMETRY</text>
</g>

<!-- boot/status strip -->
<rect x="94" y="306" width="532" height="53" rx="12" fill="#061621" stroke="#163d53"/>
<circle cx="116" cy="332" r="5" fill="#49efaa" filter="url(#glow)"><animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/></circle>
<text x="134" y="329" fill="#79a0b5" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.1">CURRENT PHASE</text>
<text x="134" y="347" fill="#effbff" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">STABILIZATION + VALIDATION</text>
<text x="401" y="329" fill="#79a0b5" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.1">SOURCE</text>
<text x="401" y="347" fill="#effbff" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">PRIVATE</text>

<!-- right neural/serpent core -->
<circle cx="940" cy="223" r="192" fill="url(#halo)" opacity=".5"><animate attributeName="opacity" values=".25;.58;.25" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="940" cy="223" r="135" fill="none" stroke="#0abbe2" stroke-width="1.5" stroke-dasharray="5 12" opacity=".48"><animateTransform attributeName="transform" type="rotate" from="0 940 223" to="360 940 223" dur="22s" repeatCount="indefinite"/></circle>
<circle cx="940" cy="223" r="107" fill="none" stroke="#51ecff" stroke-width="1" stroke-dasharray="2 8" opacity=".6"><animateTransform attributeName="transform" type="rotate" from="360 940 223" to="0 940 223" dur="15s" repeatCount="indefinite"/></circle>
<circle cx="940" cy="223" r="77" fill="none" stroke="#157fb8" stroke-width="1" stroke-dasharray="14 6" opacity=".55"><animateTransform attributeName="transform" type="rotate" from="0 940 223" to="360 940 223" dur="30s" repeatCount="indefinite"/></circle>

<!-- stylized serpent -->
<path id="serpentPath" d="M865 178 C905 142 981 148 1014 186 C1040 215 1024 247 994 258 C957 272 918 254 909 228 C901 205 919 191 940 192 C963 193 975 211 970 228 C965 246 944 252 928 245" fill="none" stroke="url(#serpent)" stroke-width="9" stroke-linecap="round" opacity=".88" filter="url(#glow)"/>
<path d="M857 170 L874 174 L865 189 Z" fill="#4beeff" opacity=".9"/>
<circle cx="864" cy="178" r="3" fill="#e8feff" filter="url(#glow)"/>
<circle r="4" fill="#8ef7ff" filter="url(#glow)"><animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#serpentPath"/></animateMotion></circle>

<!-- orbital subsystem nodes -->
<g font-family="ui-monospace,Consolas,monospace" font-size="9" text-anchor="middle">
  <g><circle cx="940" cy="73" r="5" fill="#4beaff" filter="url(#glow)"/><text x="940" y="58" fill="#6f9caf">SECURITY</text></g>
  <g><circle cx="1081" cy="170" r="5" fill="#7770ff" filter="url(#glow)"/><text x="1081" y="153" fill="#6f9caf">PLATFORM</text></g>
  <g><circle cx="1042" cy="346" r="5" fill="#43dca2" filter="url(#glow)"/><text x="1042" y="366" fill="#6f9caf">OBSERVABILITY</text></g>
  <g><circle cx="798" cy="321" r="5" fill="#28cbe7" filter="url(#glow)"/><text x="798" y="342" fill="#6f9caf">PLAYER</text></g>
</g>
<g stroke="#1b607c" stroke-width="1" opacity=".45"><line x1="940" y1="88" x2="940" y2="116"/><line x1="1067" y1="178" x2="1038" y2="188"/><line x1="1029" y1="332" x2="1008" y2="308"/><line x1="812" y1="310" x2="841" y2="287"/></g>

<!-- scanning line -->
<rect x="720" y="81" width="450" height="1" fill="#50efff" opacity=".18"><animate attributeName="y" values="81;365;81" dur="7s" repeatCount="indefinite"/></rect>

<!-- bottom telemetry -->
<line x1="42" y1="382" x2="1158" y2="382" stroke="#15384d"/>
<g font-family="ui-monospace,Consolas,monospace" font-size="9" letter-spacing="1">
  <text x="54" y="405" fill="#537b91">PUBLIC SURFACE</text><text x="155" y="405" fill="#7aa5b9">PROFILE / DOCS / SDK / API DOCS / EXAMPLES / INTEGRATIONS / STATUS</text>
  <text x="1027" y="405" fill="#537b91">SYSTEM PULSE</text>
  <circle cx="1146" cy="401" r="3" fill="#52efff"><animate attributeName="opacity" values=".2;1;.2" dur="1.3s" repeatCount="indefinite"/></circle>
</g>
</svg>