<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020914"/>
      <stop offset="0.52" stop-color="#071725"/>
      <stop offset="1" stop-color="#03101a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00a6ff"/>
      <stop offset="0.5" stop-color="#27e6ff"/>
      <stop offset="1" stop-color="#0077ff"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#67f3ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#00c8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0070ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#123047" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)" opacity="0.6"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#16344a"/>

  <g opacity="0.35">
    <path d="M760 80 C890 15 1045 55 1135 142 C1028 107 930 130 863 213 C817 270 783 302 705 312" fill="none" stroke="#0aa8d8" stroke-width="2"/>
    <path d="M810 112 C920 61 1038 92 1092 165 C1018 142 939 155 884 213 C844 254 807 282 745 290" fill="none" stroke="#21e6ff" stroke-width="1.3"/>
    <path d="M842 144 C925 114 1008 126 1048 179 C991 167 940 177 901 220 C872 250 842 267 799 272" fill="none" stroke="#56f2ff" stroke-width="1"/>
  </g>

  <circle cx="1015" cy="180" r="154" fill="url(#core)" opacity="0.55">
    <animate attributeName="opacity" values="0.35;0.62;0.35" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1015" cy="180" r="92" fill="none" stroke="#0bd8ff" stroke-width="1.5" opacity="0.45" stroke-dasharray="8 10">
    <animateTransform attributeName="transform" type="rotate" from="0 1015 180" to="360 1015 180" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1015" cy="180" r="66" fill="none" stroke="#45f0ff" stroke-width="1" opacity="0.55" stroke-dasharray="3 8">
    <animateTransform attributeName="transform" type="rotate" from="360 1015 180" to="0 1015 180" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1015" cy="180" r="8" fill="#70f6ff" filter="url(#glow)">
    <animate attributeName="r" values="6;10;6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <rect x="72" y="74" width="8" height="208" rx="4" fill="url(#cyan)" filter="url(#glow)"/>
  <text x="110" y="115" fill="#55eaff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" letter-spacing="4">LEVIATHAN // SYSTEM INTERFACE</text>
  <text x="108" y="183" fill="#f4fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="850" letter-spacing="1">LEVIATHAN</text>
  <text x="111" y="224" fill="#a9bfd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Minecraft software, security, services and developer tooling.</text>
  <text x="111" y="258" fill="#6f8da3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">LAUNCHER  •  CLIENT  •  PLATFORM  •  NIMBUS  •  API  •  TELEMETRY</text>

  <g transform="translate(110 295)">
    <circle cx="5" cy="-5" r="5" fill="#33e28a" filter="url(#glow)"><animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="22" y="0" fill="#8eabbf" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="1">ACTIVE DEVELOPMENT // SOURCE PRIVATE // PUBLIC SYSTEMS ONLINE</text>
  </g>

  <g fill="#45e9ff" opacity="0.55">
    <circle cx="760" cy="80" r="3"/><circle cx="863" cy="213" r="3"/><circle cx="1092" cy="165" r="3"/><circle cx="884" cy="213" r="3"/>
  </g>
</svg>